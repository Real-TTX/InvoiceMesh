# InvoiceMesh - the published image and a PostgreSQL. Copy this file, then:
#
#   echo "INVOICEMESH_DB_PASSWORD=$(openssl rand -hex 24)" > .env    # once, before the first start
#   docker compose up -d
#
# Web: http://localhost:2308 - the first visit creates the administrator (there is no default password).
# Update: docker compose pull && docker compose up -d (the database migrates itself on start).
#
# The database password from ".env" is used by both services. PostgreSQL keeps it in its volume after the first start,
# so changing it later means changing it in the database as well (ALTER USER postgres PASSWORD '...').
name: invoicemesh

services:
  invoicemesh:
    image: ghcr.io/real-ttx/invoicemesh:latest   # :nightly = the newest state of the branch dev
    container_name: invoicemesh
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2308:2308"   # plain HTTP: for anything beyond the local network put a reverse proxy with TLS in front
    environment:
      TZ: Europe/Berlin
      INVOICEMESH__Database__Password: ${INVOICEMESH_DB_PASSWORD:-invoicemesh}
      # Behind a reverse proxy with HTTPS - the share links carry this address, and the cookie is only sent over HTTPS:
      # INVOICEMESH__Server__PublicUrl: https://invoices.example.com
      # INVOICEMESH__Server__ForceSecureCookie: "true"
    volumes:
      - invoicemesh-data:/data
      # Backups to a NAS: either over SMB from the app (Einstellungen > Backup > Ziele, nothing to mount),
      # or a folder of the NAS mounted here and entered as "/backups" in a target of the kind "Ordner im Container oder Volume".
      # The app runs as UID 1654, so that folder must be writable for it.
      # - /volume1/backups/invoicemesh:/backups

  db:
    image: postgres:17
    container_name: invoicemesh-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INVOICEMESH_DB_PASSWORD:-invoicemesh}
      POSTGRES_DB: invoicemesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicemesh"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - invoicemesh-db:/var/lib/postgresql/data

volumes:
  invoicemesh-data:
  invoicemesh-db:
