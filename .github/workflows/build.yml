name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    # The integration tests run against a real PostgreSQL, for the NAS targets and intake folders a Samba server
    # (SMB on port 445, which is where SMBLibrary connects), and for the mailbox intake a mail server (GreenMail: IMAP 3143, SMTP 3025, any sign-in).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: invoicemesh
          POSTGRES_DB: invoicemesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      samba:
        image: servercontainers/samba@sha256:de2f1c141e497ea287ba099788cb4526859f0b0336214a7e7dcf89d1f90525b7
        env:
          ACCOUNT_backup: backup-secret
          UID_backup: '1000'
          SAMBA_VOLUME_CONFIG_backups: '[backups]; path=/shares/backups; valid users = backup; guest ok = no; read only = no; browseable = yes; force user = root; force group = root'
        ports:
          - 445:445
        volumes:
          - /tmp/invoicemesh-samba:/shares/backups
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3025:3025
          - 3143:3143

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # main -> release (<major>.<minor>.<run number>-<date>), dev -> nightly (nightly-<run number>-<date>), everything else -> local.
      - name: Determine version metadata
        id: ver
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main) channel=release ;;
            dev)  channel=nightly ;;
            *)    channel=local ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then channel=local; fi
          {
            echo "channel=$channel"
            echo "date=$(date -u +%Y%m%d)"
            echo "build=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore InvoiceMesh.slnx

      - name: Build
        run: >
          dotnet build InvoiceMesh.slnx -c Release --no-restore
          -p:Channel=${{ steps.ver.outputs.channel }}
          -p:BuildNumber=${{ steps.ver.outputs.build }}
          -p:BuildDate=${{ steps.ver.outputs.date }}

      - name: Test
        env:
          INVOICEMESH_TEST_DB: Host=localhost;Port=5432;Database=invoicemesh_test;Username=postgres;Password=invoicemesh
          INVOICEMESH_TEST_SMB: localhost;share=backups;user=backup;password=backup-secret
          INVOICEMESH_TEST_IMAP: localhost;imap=3143;smtp=3025
          INVOICEMESH_XRECHNUNG_OUT: ${{ runner.temp }}/xrechnung
        # The GitHubActions logger shows every failed test as an annotation of the run (and in the summary of a pull request).
        run: dotnet test InvoiceMesh.slnx -c Release --no-build --verbosity normal --logger GitHubActions

      # The XRechnungen the tests wrote go through the validator of the KoSIT with the official XRechnung configuration: our own rules are a subset,
      # this is the check that counts. A rejected file fails the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: XRechnung (KoSIT validator)
        shell: bash
        run: |
          k="${RUNNER_TEMP}/kosit"
          mkdir -p "$k/config" "$k/out"
          curl -sSLo "$k/validator.jar" https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
          curl -sSLo "$k/config.zip" https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
          unzip -oq "$k/config.zip" -d "$k/config"
          ls "${RUNNER_TEMP}/xrechnung"
          java -jar "$k/validator.jar" -s "$k/config/scenarios.xml" -r "$k/config" -o "$k/out" "${RUNNER_TEMP}"/xrechnung/*.xml | tee "$k/result.txt"
          grep -q "Rejected:  0" "$k/result.txt"

      - name: Resolve version string
        id: appver
        shell: bash
        run: |
          v=$(dotnet msbuild src/InvoiceMesh/InvoiceMesh.csproj -getProperty:InformationalVersion \
                -p:Channel=${{ steps.ver.outputs.channel }} \
                -p:BuildNumber=${{ steps.ver.outputs.build }} \
                -p:BuildDate=${{ steps.ver.outputs.date }})
          v=$(echo "$v" | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: img
        shell: bash
        run: echo "name=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release: <version>, latest, release   |   nightly: <version>, nightly   |   pull requests: build only.
      - name: Image tags
        id: tags
        shell: bash
        run: |
          image="${{ steps.img.outputs.name }}"
          version="${{ steps.appver.outputs.version }}"
          case "${{ steps.ver.outputs.channel }}" in
            release) tags="$image:$version"$'\n'"$image:latest"$'\n'"$image:release" ;;
            nightly) tags="$image:$version"$'\n'"$image:nightly" ;;
            *)       tags="$image:$version" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            Channel=${{ steps.ver.outputs.channel }}
            BuildNumber=${{ steps.ver.outputs.build }}
            BuildDate=${{ steps.ver.outputs.date }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
